name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build for MC 26.1
        run: ./gradlew build -Ptarget_mc=26.1 --no-daemon

      - name: Build for MC 26.1.1
        run: ./gradlew build -Ptarget_mc=26.1.1 --no-daemon

      - name: Build for MC 26.1.2
        run: ./gradlew build -Ptarget_mc=26.1.2 --no-daemon

      - name: Build for MC 26.2
        run: ./gradlew build -Ptarget_mc=26.2 --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgzjdvchat-jars
          path: build/libs/*.jar
